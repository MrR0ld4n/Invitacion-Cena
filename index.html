<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noche de Estrellas</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--g1:#8a6a1f;--g2:#f1d98a;--g3:#d4af37;--gold:#d4af37;--ivory:#f5ecd6;--mute:#9b9078;
--grad:linear-gradient(110deg,#8a6a1f 0%,#f1d98a 30%,#d4af37 50%,#fff2c2 68%,#9c7a24 100%)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100dvh;overflow-x:hidden;overflow-y:clip;background:var(--bg);color:var(--ivory);font-family:'Jost',system-ui,sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* marco */
#frame{position:fixed;inset:12px;border:1px solid #d4af3755;z-index:2;pointer-events:none;transition:opacity 0.5s;}
#frame::before{content:"";position:absolute;inset:5px;border:1px solid #d4af3722}
#frame i{position:absolute;width:24px;height:24px;border:2px solid var(--gold)}
#frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0}
#frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0}
#frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0}
#frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0}

/* Logo en cada página */
#brand{position:fixed;top:calc(36px + env(safe-area-inset-top,0px));left:0;right:0;z-index:5;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:all 0.5s ease;padding:0 20px}
#brand img{height:clamp(110px, 20dvh, 185px);max-width:min(420px, 85vw);object-fit:contain;filter:drop-shadow(0 0 25px rgba(212,175,55,0.5));transition:all 0.5s ease;}
body.ready #brand{opacity:1}

/* pantallas */
.screen{position:fixed;inset:0;height:100dvh;width:100%;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(155px, 26dvh, 235px) clamp(20px, 5vw, 36px) clamp(92px, 14dvh, 110px);opacity:0;visibility:hidden;transform:scale(.96);filter:blur(8px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter .9s,visibility .9s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{opacity:1;visibility:visible;transform:none;filter:none}
.screen.out{transform:scale(1.05)}
.screen>*{margin-left:auto;margin-right:auto;flex-shrink:0}
.screen.on>*{animation:up 1s both cubic-bezier(.2,.7,.2,1)}
.screen.on>*:nth-child(2){animation-delay:.18s}.screen.on>*:nth-child(3){animation-delay:.36s}
.screen.on>*:nth-child(4){animation-delay:.54s}.screen.on>*:nth-child(5){animation-delay:.72s}.screen.on>*:nth-child(6){animation-delay:.9s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.gold{background:var(--grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0 0}50%{background-position:100% 0}}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
h1{font-size:clamp(2.2rem, 8.8vw, 6rem);line-height:1.02;letter-spacing:.06em;margin:14px 0}
h2{font-size:clamp(1.65rem, 5.2vw, 3rem);letter-spacing:.08em;margin-bottom:16px}
.sm{font-size:clamp(0.68rem, 2vw, 0.78rem);letter-spacing:.34em;color:var(--gold)}
.lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(1.05rem, 3.2vw, 1.6rem);color:var(--ivory);max-width:640px;line-height:1.55}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;margin:12px 0;width:min(300px,70%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn svg{width:16px;height:16px;fill:var(--gold);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:rotate(45deg) scale(1.3);opacity:.6}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px, 3vw, 30px) clamp(16px, 5vw, 44px);max-width:680px;width:100%;margin-top:8px}
.facts b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.15rem, 3.4vw, 1.8rem);color:var(--ivory);overflow-wrap:anywhere}
.facts span{font-size:clamp(0.62rem, 1.8vw, 0.72rem);letter-spacing:.28em;color:var(--gold)}
#count{display:flex;flex-wrap:wrap;gap:clamp(12px, 3vw, 26px);justify-content:center;margin-top:24px}
#count b{display:block;font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem, 5vw, 2.2rem);font-weight:500}
#count span{font-size:0.62rem;letter-spacing:.28em;color:var(--mute)}

/* ====== UBICACIÓN, MAPA Y VIDEO ====== */
.screen-ubicacion { position: relative; z-index: 1; }

.ubicacion-bg-wrapper { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg-layer {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 1s ease-in-out;
  background-image: var(--bg-img);
}
.bg-layer.active { opacity: 0.35; background-image: linear-gradient(rgba(5,5,5,0.3), rgba(5,5,5,0.6)), var(--bg-img); }

#theme-toggle {
  position: fixed; top: calc(24px + env(safe-area-inset-top,0px)); right: calc(22px + env(safe-area-inset-right,0px)); z-index: 10;
  background: rgba(0,0,0,0.45); border: 1px solid var(--gold); color: var(--gold);
  width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
  display: flex; justify-content: center; align-items: center;
  transition: 0.3s; backdrop-filter: blur(5px); font-size: 1.15rem;
}
#theme-toggle:hover { background: var(--gold); color: #000; }

.media-container {
  width: min(100%, 780px);
  aspect-ratio: 16 / 9;
  max-height: 36dvh;
  height: auto;
  margin: 12px 0 12px;
  border: 1px solid var(--gold);
  border-radius: 2px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  position: relative; z-index: 2;
  background: #000;
  overflow: hidden;
}

.map, .video-wrapper {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
  transition: opacity 0.4s ease;
}
.video-wrapper { opacity: 0; pointer-events: none; z-index: 2; }
.video-wrapper video { width: 100%; height: 100%; object-fit: cover; border: none; display: block; }
.video-wrapper.active { opacity: 1; pointer-events: auto; }
.map.hidden { opacity: 0; pointer-events: none; }

.btn-ocultar {
  background: rgba(0,0,0,0.65); border: 1px solid var(--gold); color: var(--gold);
  padding: 9px 18px; font: inherit; font-size: 0.72rem; letter-spacing: 0.2em;
  border-radius: 30px; cursor: pointer; margin-bottom: 12px; transition: 0.3s;
  z-index: 2; position: relative; backdrop-filter: blur(5px);
}
.btn-ocultar:hover { background: var(--gold); color: #000; }

.lnk {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom,0px));
  left: 50%; transform: translateX(-50%);
  color: var(--gold); text-decoration: none;
  border-bottom: 1px solid var(--gold); font-size: 0.72rem;
  letter-spacing: 0.22em; padding-bottom: 3px; z-index: 10;
  text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  white-space: nowrap;
}

/* navegación (CIRCULOS INDICADORES) */
#nav{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transition:opacity 1.2s}
#dots{display:flex;gap:10px}
#dots button{
  width: 11px; height: 11px; border-radius: 50%;
  border: 1px solid var(--gold); background: none;
  padding:0; cursor:pointer; transition:.4s;
}
#dots button.a{
  background: var(--gold); transform: scale(1.3);
  box-shadow: 0 0 10px var(--gold);
}
#hint{font-size:0.62rem;letter-spacing:.3em;color:var(--mute);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#back{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:none;border:0;color:var(--gold);font-size:1.35rem;cursor:pointer;opacity:0;pointer-events:none;transition:.4s}
#back.v{opacity:.9;pointer-events:auto}

/* ====== TOQUES DE AGUA (INDICADORES LATERALES) ====== */
.nav-hint {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  z-index: 10; pointer-events: none;
  opacity: 0; transition: opacity 0.6s ease;
  background: radial-gradient(circle, rgba(212,175,55,0.35) 0%, rgba(212,175,55,0) 70%);
}
.nav-hint.show { opacity: 1; }

#hint-left { left: 8px; }
#hint-right { right: 8px; }

#hint-left.show { animation: rippleLeft 2.5s infinite; }
#hint-right.show { animation: rippleRight 2.5s infinite; }

@keyframes rippleLeft {
  0% { transform: scale(0.8) translateY(-50%); opacity: 0.3; }
  50% { transform: scale(1.4) translateY(-50%); opacity: 1; }
  100% { transform: scale(0.8) translateY(-50%); opacity: 0.3; }
}

@keyframes rippleRight {
  0% { transform: scale(0.8) translateY(-50%); opacity: 0.3; }
  50% { transform: scale(1.4) translateY(-50%); opacity: 1; }
  100% { transform: scale(0.8) translateY(-50%); opacity: 0.3; }
}

/* ====== ANIMACIÓN DE INTRO ====== */
#intro{position:fixed;inset:0;height:100dvh;z-index:99;background:#050505;display:flex;justify-content:center;align-items:center;transition:opacity .8s, visibility .8s}
#intro.off{opacity:0;visibility:hidden}
#intro-logo{position:absolute;width:min(72vw, 420px);max-height:36dvh;object-fit:contain;opacity:0;transform:scale(0.3);transition:transform 1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1s ease;z-index:2;}
#intro-logo.visible{opacity:1;transform:scale(1);}
#intro-glow{position:absolute;width:min(72vw, 420px);height:min(72vw, 420px);max-height:38dvh;background:radial-gradient(circle, rgba(212,175,55,0.4) 0%, transparent 60%);opacity:0;transform:scale(0.5);transition:opacity 1s ease, transform 1s ease;z-index:1;}
#intro-glow.visible{opacity:1;transform:scale(1.5);animation:pulseGlow 2s ease-in-out infinite alternate;}
@keyframes pulseGlow {0% { transform: scale(1.2); opacity: 0.6; }100% { transform: scale(1.8); opacity: 0.9; }}
#intro-logo.fly{transition:transform 1s cubic-bezier(0.6, 0, 0.2, 1), opacity 1s ease;transform:scale(0.35) translate(0, -110dvh);opacity:0;}
#intro-glow.fly{transition:transform 1s ease, opacity 1s ease;transform:scale(3);opacity:0;}
#skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(24px + env(safe-area-inset-right,0px));background:none;border:1px solid #d4af3755;color:var(--mute);padding:8px 18px;font:inherit;font-size:.72rem;letter-spacing:.25em;cursor:pointer;border-radius:30px;z-index:100}

@media (max-width:560px), (max-height:700px){
  #brand{top:calc(24px + env(safe-area-inset-top,0px));}
  #brand img{height:clamp(95px, 16dvh, 135px);}
  .screen{padding-top:clamp(132px, 22dvh, 175px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));}
  .media-container{max-height:30dvh;aspect-ratio:auto;height:min(28dvh, 210px);}
  .nav-hint{width:38px;height:38px;}
  #hint-left{left:4px;}
  #hint-right{right:4px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="frame"><i></i><i></i><i></i><i></i></div>
<div id="brand"><img id="logo" alt="" hidden></div>

<!-- TOQUES DE AGUA (INDICADORES LATERALES) -->
<div class="nav-hint" id="hint-left"></div>
<div class="nav-hint" id="hint-right"></div>

<!-- 1 PORTADA -->
<div class="screen">
  <p class="sm" id="kicker"></p>
  <h1 class="gold">NOCHE<br>DE ESTRELLAS</h1>
  <div class="orn"><svg viewBox="0 0 24 24"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg></div>
  <p class="lead">Gala de reconocimiento al alto rendimiento y la excelencia</p>
</div>

<!-- 2 RECONOCIMIENTO -->
<div class="screen">
  <p class="sm">EL MOTIVO</p>
  <h2 class="gold">Una noche para quienes brillan</h2>
  <div class="orn"><svg viewBox="0 0 24 24"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg></div>
  <p class="lead" id="motivo"></p>
</div>

<!-- 3 DETALLES -->
<div class="screen">
